[package]
name = "janus-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Janus core runtime daemon: plugin execution, API server, state management"

[[bin]]
name = "janus-runtime"
path = "src/main.rs"
required-features = ["runtime-server"]

[features]
default = ["runtime-server"]
runtime-server = [
  "dep:janus-core",
  "dep:tokio-tungstenite",
  "dep:rusqlite",
  "dep:axum",
  "dep:tower",
  "dep:tower-http",
  "dep:chrono",
  "dep:base64",
  "dep:chacha20poly1305",
  "dep:rand_core",
  "dep:ed25519-dalek",
  "dep:tracing-subscriber",
  "dep:uuid",
  "dep:reqwest",
  "dep:serialport",
  "dep:sha2",
  "dep:machine-uid",
  "dep:clap",
]

[dependencies]
janus-core = { path = "../janus-core", optional = true }
tokio.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
mlua.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
anyhow.workspace = true
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
machine-uid = { workspace = true, optional = true }
libc = "0.2"
clap = { workspace = true, optional = true }
