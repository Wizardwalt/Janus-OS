[package]
name = "janus-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "janus-web"
path = "src/main.rs"

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
axum       = { workspace = true }
tower-http = { version = "0.5", features = ["fs", "cors"] }
mlua       = { version = "0.10", features = ["lua54", "vendored"] }
rand       = "0.8"
# Server-side reverse proxy to the runtime daemon. TLS is deliberately disabled:
# the proxy only ever talks to the runtime over the local interface.
reqwest    = { version = "0.11", default-features = false }
