// Root build script for the JanusOS Android application.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

// `gradle :app:clean` removes the packaged JanusOS assets and native libraries
// that are staged into app/build by the asset/native sync tasks.
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
