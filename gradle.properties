# JanusOS Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8 no longer generates BuildConfig automatically; the app reads
# VERSION_CODE / FULL_CATALOGUE / JANUS_LICENSE_PUBLIC_KEY from it.
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# Overrides:
#   janusFullCatalogue=true   package modules/ + apocalypse_engineering/ too
#   janusRustAbi=x86_64       build for an emulator instead of the CM5
#   janusLicensePublicKey=... bake the Ed25519 licence key into the build
