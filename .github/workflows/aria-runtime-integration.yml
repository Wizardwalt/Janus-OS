name: Aria encrypted runtime integration

on:
  push:
    branches: [main, feature/omnivault-aria-import]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-runtime-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-runtime:
    name: Authenticated Aria conversation integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      JANUS_TEST_RESULTS: /tmp/janus-aria-runtime-test-results.txt
      JANUS_RUNTIME_LOG: /tmp/janus-aria-runtime.log
    steps:
      - name: Check out Janus
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev libudev-dev build-essential jq curl

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-aria-runtime-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-aria-runtime-

      - name: Build the actual Janus runtime
        run: cargo build --locked -p janus-runtime --bin janus-runtime

      - name: Run authenticated encrypted-store integration checks
        run: bash scripts/test-aria-runtime-integration.sh

      - name: Upload synthetic test report and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-aria-runtime-integration-${{ github.run_id }}
          path: |
            /tmp/janus-aria-runtime-test-results.txt
            /tmp/janus-aria-runtime.log
            /tmp/janus-aria-runtime-no-key.log
          if-no-files-found: warn
          retention-days: 14
