name: Plugin worker cross-target checks

on:
  pull_request:
    branches: [main]
    paths:
      - "janus-runtime/src/bin/janus-plugin-worker.rs"
      - "janus-runtime/src/lua.rs"
      - "janus-runtime/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/plugin-worker-cross-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-check:
    name: Compile worker for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Cross-compile plugin worker
        run: cross check --locked --target ${{ matrix.target }} -p janus-runtime --bin janus-plugin-worker

      - name: Compile worker seccomp test harness
        run: cross test --no-run --locked --target ${{ matrix.target }} -p janus-runtime --bin janus-plugin-worker
  android-aarch64:
    name: Compile worker for aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018
          accept-android-sdk-licenses: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile plugin worker for Android
        run: cargo ndk -t arm64-v8a --platform 23 check --no-default-features -p janus-runtime --bin janus-plugin-worker

      - name: Compile Android worker seccomp test harness
        run: cargo ndk -t arm64-v8a --platform 23 test --no-run --no-default-features -p janus-runtime --bin janus-plugin-worker

      - name: Report Android target lockfile delta (informational)
        if: always()
        run: git diff -- Cargo.lock || true
