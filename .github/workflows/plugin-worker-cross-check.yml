name: Plugin worker cross-target checks

on:
  pull_request:
    branches: [main]
    paths:
      - "janus-runtime/src/bin/janus-plugin-worker.rs"
      - "janus-runtime/src/lua.rs"
      - "janus-runtime/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/plugin-worker-cross-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-check:
    name: Compile worker for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Cross-compile plugin worker
        run: cross check --locked --target ${{ matrix.target }} -p janus-runtime --bin janus-plugin-worker
