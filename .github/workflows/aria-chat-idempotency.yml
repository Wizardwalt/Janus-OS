name: Aria chat retry and idempotency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  aria-chat-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libssl-dev libudev-dev build-essential jq

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ubuntu-latest-aria-chat
          restore-keys: |
            ubuntu-latest-cargo-

      - name: Build Janus runtime
        run: cargo build --release --bin janus-runtime

      - name: Exercise provider failure, retry, and idempotency
        run: bash scripts/test-aria-chat-idempotency.sh

      - name: Upload Aria integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aria-chat-idempotency-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
