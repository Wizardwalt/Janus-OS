name: Janus Android emulator smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    # Hosted GitHub runners may lack KVM. Android Emulator 37 requires this
    # explicit opt-in when the runner action falls back to TCG software CPU.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Janus debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Install and launch Janus in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-emulator-smoke-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
