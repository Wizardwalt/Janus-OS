name: Janus Android emulator smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    # Hosted GitHub runners may lack KVM. Android Emulator 37 requires this
    # explicit opt-in when the runner action falls back to TCG software CPU.
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Janus debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Install and launch Janus in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.janus.omega
            adb shell monkey -p com.janus.omega -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.janus.omega
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep com.janus.omega
            mkdir -p test-results
            adb logcat -d -t 5000 > test-results/emulator-logcat.txt
            if grep -q "FATAL EXCEPTION" test-results/emulator-logcat.txt; then
              echo "Fatal Android exception found in emulator log."
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-emulator-smoke-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
