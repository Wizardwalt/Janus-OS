name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Run Android unit tests and build debug/release APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: janus-os-android-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: janus-os-android-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: janus-os-android-debug
          path: artifacts/debug

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: janus-os-android-release
          path: artifacts/release

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
